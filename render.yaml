# Render Blueprint — single Docker service + managed Postgres
#
# Deploy: push to GitHub → render.com → New+ → Blueprint → pick this repo
# Render reads this file, provisions the DB and app automatically.
#
# After first deploy:
#   1. Copy the app's public URL (e.g. https://strings-app.onrender.com)
#   2. Set JWT_SECRET via Render dashboard (see secrets below)
#   3. Set LIVEKIT_*, BREVO_*, VAPID_* via dashboard (secrets)
#   4. Redeploy

services:
  - type: web
    name: strings-app
    runtime: docker
    plan: starter          # $7/mo. 'free' works but spins down after 15min idle.
    region: frankfurt      # change to nearest: oregon, ohio, singapore, frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      # Automatically populated from the database block below
      - key: DATABASE_URL
        fromDatabase:
          name: strings-db
          property: connectionString

      # --- The following have no defaults and must be set manually ---
      # See Render Dashboard → strings-app → Environment after first deploy
      - key: JWT_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Strings
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:noreply@example.com

databases:
  - name: strings-db
    plan: free            # 256MB free, upgrade to starter ($7/mo) for 1GB
    region: frankfurt     # must match the app's region
    databaseName: strings
    user: strings_user
    postgresMajorVersion: "16"
