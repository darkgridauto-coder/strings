<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strings · Offline</title>
<style>
  body{font:16px/1.5 -apple-system,BlinkMacSystemFont,Inter,sans-serif;background:#fff;color:#0a0a0a;margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}
  @media (prefers-color-scheme: dark){body{background:#0b0b0b;color:#f4f4f4}p{color:#9a9a9a}button{background:#f4f4f4;color:#0b0b0b;border-color:#f4f4f4}}
  h1{font-size:1.4em;letter-spacing:.3em;text-transform:uppercase;font-weight:800;margin:0 0 16px}
  p{color:#767676;max-width:340px;margin:0 auto 28px;line-height:1.55}
  button{padding:12px 28px;border-radius:999px;border:1.5px solid #0a0a0a;background:#0a0a0a;color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div>
    <h1>Strings</h1>
    <p>You're offline. Reconnect to continue.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
